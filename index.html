<style>
:root{
  color-scheme:dark;
  --background:#000000;
  --surface:#080808;
  --surface-2:#101010;
  --surface-3:#161616;
  --foreground:#F5F5F5;
  --muted-foreground:#929292;
  --faint:#5C5C5C;
  --silver:#C8C8C8;
  --border:#202020;
  --border-strong:#3A3A3A;
  --font-sans:"Geist",system-ui,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,monospace;
  --font-serif:"Instrument Serif",Georgia,serif;
  --font-doto:"Doto",var(--font-mono);
  --radius:14px;
  --content:1440px;
  --page-pad:40px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:118px}
body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans);font-weight:400;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body:before{content:"";position:fixed;z-index:-1;inset:0;pointer-events:none;background-image:radial-gradient(#3B3B3B 1px,transparent 1.2px);background-size:22px 22px;opacity:.24;mask-image:radial-gradient(ellipse at 88% 4%,#000 0%,rgba(0,0,0,.72) 36%,transparent 82%)}
body.menu-open{overflow:hidden}
::selection{background:#fff;color:#000}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
a:focus-visible,button:focus-visible{outline:1px solid var(--foreground);outline-offset:3px}
img{max-width:100%}
.wrap{width:min(var(--content),calc(100% - var(--page-pad)*2));margin-inline:auto}
.skip-link{position:fixed;z-index:200;top:12px;left:12px;padding:11px 15px;border:1px solid var(--border-strong);border-radius:999px;background:#fff;color:#000;font:11px var(--font-mono);transform:translateY(-150%);transition:transform .25s}
.skip-link:focus{transform:translateY(0)}
.silver-text{background:linear-gradient(180deg,#FCFCFC 0%,#D6D6D6 45%,#707070 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.micro-label,.section-label,.label{font-family:var(--font-mono);font-size:11px;line-height:1.4;letter-spacing:.14em;text-transform:uppercase;color:var(--muted-foreground)}
.section-label{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.section-label>span:first-child{color:var(--foreground)}
.section-label i{display:block;width:32px;height:1px;background:var(--border-strong)}
.arrow-icon{display:inline-block;font-size:16px;font-weight:300;line-height:1;transition:transform .25s}
a:hover .arrow-icon{transform:translate(3px,-3px)}
a:hover .arrow-icon:where(:not(.down)){color:#fff}
.arrow-icon.down{font-size:18px}
.pill-button{display:inline-flex;align-items:center;justify-content:center;gap:11px;min-height:43px;padding:0 17px;border:1px solid var(--border-strong);border-radius:999px;font-size:11px;font-weight:600;transition:background .25s,color .25s,border-color .25s,transform .25s}
.pill-button:hover{transform:translateY(-2px)}
.pill-button.white{background:#f4f4f4;border-color:#f4f4f4;color:#050505}
.pill-button.white:hover{background:#fff;border-color:#fff}
.pill-button.outline{background:transparent;color:#ddd}
.pill-button.outline:hover{background:#fff;color:#000;border-color:#fff}
.link-draw{position:relative}
.link-draw:after{content:"";position:absolute;bottom:-4px;left:0;width:100%;height:1px;background:currentColor;transform:scaleX(0);transform-origin:left;transition:transform .3s}
.link-draw:hover:after{transform:scaleX(1)}
.spotlight{position:relative;isolation:isolate;overflow:hidden}
.spotlight:before{content:"";position:absolute;z-index:0;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.07),transparent 72%);opacity:0;transition:opacity .35s}
.spotlight:hover:before{opacity:1}
.site-header{position:sticky;z-index:100;top:0;padding-top:10px;margin-bottom:0}
.availability-strip{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:34px;padding:0 3px 9px;border-bottom:1px solid var(--border);overflow:hidden;max-height:44px;opacity:1;transition:max-height .4s,padding .4s,opacity .3s,border-color .3s}
.availability-strip>div{display:flex;align-items:center;gap:9px;font-size:10px;color:var(--muted-foreground)}
.availability-strip strong{color:var(--foreground);font-weight:500}
.availability-dash{color:var(--faint)}
.availability-strip small{color:var(--faint);font:9px var(--font-mono)}
.breathing-ring,.tiny-dot{display:inline-block;flex:0 0 auto;width:7px;height:7px;border:1px solid var(--silver);border-radius:50%;box-shadow:0 0 0 0 rgba(255,255,255,.12);animation:breathe 2.6s ease-in-out infinite}
.main-nav{display:flex;align-items:center;justify-content:space-between;gap:22px;min-height:69px;padding:9px 12px;margin:9px auto 0;border:1px solid transparent;border-radius:999px;background:rgba(0,0,0,.5);transition:width .45s,background .35s,border-color .35s,box-shadow .35s,padding .35s}
.brand{display:flex;align-items:center;gap:10px;min-width:205px;transition:min-width .3s}
.brand img{width:36px;height:36px;object-fit:cover;border-radius:50%;border:1px solid var(--border-strong);filter:grayscale(1);transition:filter .3s}
.brand:hover img{filter:grayscale(0)}
.brand-copy{display:grid;gap:3px;transition:opacity .25s,width .25s}
.brand-copy b{font-size:11px;font-weight:600}
.brand-copy small{font:9px var(--font-mono);color:var(--muted-foreground)}
.desktop-links{display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px}
.desktop-links a{padding:10px 14px;border-radius:999px;color:#aaa;font-size:11px;transition:background .25s,color .25s,transform .25s}
.desktop-links a:hover{color:#fff;background:#151515}
.desktop-links a.active{background:#f5f5f5;color:#000;animation:active-pill .25s ease both}
.nav-actions{display:flex;align-items:center;gap:8px}
.github-pill{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border:1px solid var(--border-strong);border-radius:999px;color:#ddd;font-size:10px;transition:background .25s,color .25s,border-color .25s}
.github-pill:hover{background:#fff;color:#000;border-color:#fff}
.github-pill .arrow-icon{font-size:14px}
.menu-toggle{display:none;align-items:center;gap:9px;padding:10px 14px;border:1px solid var(--border-strong);border-radius:999px;background:transparent;font-size:11px;cursor:pointer}
.menu-toggle span{display:block;width:13px;height:1px;background:#eee}
.site-header.scrolled .availability-strip{max-height:0;min-height:0;padding-top:0;padding-bottom:0;opacity:0;border-color:transparent}
.site-header.scrolled .main-nav{width:min(760px,calc(100% - 24px));min-height:56px;margin-top:0;padding:6px 11px;border-color:rgba(255,255,255,.18);background:rgba(8,8,8,.9);box-shadow:0 16px 52px rgba(0,0,0,.72),0 0 0 1px rgba(255,255,255,.025);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}
.site-header.scrolled .brand{min-width:40px;width:40px}
.site-header.scrolled .brand-copy{width:0;opacity:0;overflow:hidden}
.site-header.scrolled .brand img{width:34px;height:34px}
.mobile-sheet{position:fixed;z-index:150;inset:0;display:flex;flex-direction:column;padding:25px 24px 26px;background:#000;opacity:0;visibility:hidden;transform:translateY(-10px);transition:opacity .3s,transform .35s,visibility .3s}
.mobile-sheet.open{opacity:1;visibility:visible;transform:translateY(0)}
.mobile-sheet-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--border);color:var(--muted-foreground);font:10px var(--font-mono);letter-spacing:.14em;text-transform:uppercase}
.mobile-sheet-head button{padding:9px 13px;border:1px solid var(--border-strong);border-radius:999px;background:transparent;font:10px var(--font-mono);text-transform:none}
.mobile-sheet-links{display:flex;flex:1;flex-direction:column;justify-content:center;gap:3px;padding:30px 0}
.mobile-sheet-links a{display:flex;align-items:center;gap:15px;padding:9px 0;font-size:clamp(40px,10vw,68px);font-weight:500;letter-spacing:-.075em;line-height:1.13;opacity:0;transform:translateX(-18px);transition:color .2s,opacity .35s,transform .35s}
.mobile-sheet.open .mobile-sheet-links a{opacity:1;transform:translateX(0)}
.mobile-sheet.open .mobile-sheet-links a:nth-child(2){transition-delay:40ms}.mobile-sheet.open .mobile-sheet-links a:nth-child(3){transition-delay:80ms}.mobile-sheet.open .mobile-sheet-links a:nth-child(4){transition-delay:120ms}.mobile-sheet.open .mobile-sheet-links a:nth-child(5){transition-delay:160ms}
.mobile-sheet-links a small{width:28px;color:#696969;font:10px var(--font-mono);letter-spacing:0}
.mobile-sheet-links a span{margin-left:auto;color:#666;font-size:18px}
.mobile-sheet-links a.active,.mobile-sheet-links a:hover{color:#fff}
.mobile-sheet-bottom{padding-top:18px;border-top:1px solid var(--border)}
.mobile-sheet-bottom p{display:flex;align-items:center;gap:10px;margin:0 0 17px;color:#aaa;font:9px var(--font-mono)}
.mobile-sheet-bottom p i{width:6px;height:6px;border-radius:50%;background:#ccc;animation:breathe 2.6s infinite}
.mobile-sheet-bottom>div{display:flex;gap:9px}
.mobile-sheet-bottom .pill-button{flex:1}

main{padding-top:18px}
section{scroll-margin-top:115px}
.hero{position:relative;padding-top:20px}
.hero-meta-row{display:flex;align-items:center;gap:13px;padding:0 0 16px;border-bottom:1px solid var(--border);color:#858585;font:9px var(--font-mono);letter-spacing:.11em;text-transform:uppercase}
.hero-meta-row i{width:3px;height:3px;border-radius:50%;background:#666}
.hero-grid{display:grid;grid-template-columns:1.06fr .94fr;gap:50px;align-items:center;min-height:600px;padding:64px 0 76px}
.hero-copy{min-width:0}
.hero-title{margin:0 0 35px;font-size:clamp(7rem,14.5vw,15.5rem);font-weight:500;line-height:.78;letter-spacing:-.095em;transform:translateZ(0);will-change:transform}
.title-mask{display:block;overflow:hidden;padding:0 .04em .07em 0}
.title-mask>span{display:block;transform:translateY(110%);animation:title-rise 1.2s cubic-bezier(.16,1,.3,1) forwards}
.title-mask.sony{margin-left:.42em;margin-top:.07em}
.title-mask.sony>span{font-family:var(--font-serif);font-style:italic;font-weight:400;letter-spacing:-.035em;line-height:.75;background:linear-gradient(180deg,#FCFCFC 0%,#D6D6D6 45%,#707070 100%);-webkit-background-clip:text;background-clip:text;color:transparent;animation-delay:110ms}
.hello-row{display:grid;grid-template-columns:74px 1fr;gap:13px;max-width:625px}
.hello-row>span{padding-top:2px;color:#f5f5f5;font:11px var(--font-mono)}
.hello-row p{margin:0;color:#aaa;font-size:13px;line-height:1.95}
.hello-row p b{color:#f4f4f4;font-weight:600}
.hello-row p em{font-family:var(--font-serif);font-size:1.3em;color:#eee}
.hero-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:27px 0 0 87px}
.hero-offline{display:flex;align-items:center;gap:10px;margin:26px 0 0 87px;color:#929292;font:9px var(--font-mono)}
.hero-visual{min-width:0;perspective:1300px}
.editor-window{padding:0;border:1px solid #383838;border-radius:13px;background:radial-gradient(ellipse at 50% 0%,#262626 0%,#101010 42%,#050505 100%);box-shadow:0 0 0 1px rgba(255,255,255,.035),0 28px 90px rgba(0,0,0,.8),0 0 30px rgba(255,255,255,.035);transform:perspective(1200px);transition:transform .18s ease-out,border-color .3s;will-change:transform}
.editor-window:before{z-index:2}
.editor-titlebar{display:flex;align-items:center;gap:14px;padding:13px 15px;border-bottom:1px solid #313131}
.window-controls{display:flex;gap:6px}
.window-controls i{width:7px;height:7px;border-radius:50%;background:#666}
.window-controls i:nth-child(2){background:#4e4e4e}.window-controls i:nth-child(3){background:#393939}
.editor-path{margin:auto;color:#aaa;font:9px var(--font-mono)}
.editor-path b{color:#eee;font-weight:500}
.editor-window-mark{color:#6a6a6a;font-size:12px}
.editor-tabs{display:flex;align-items:center;gap:18px;padding:10px 16px;border-bottom:1px solid #242424;color:#707070;font:9px var(--font-mono)}
.editor-tabs .tab-active{color:#eee}
.editor-tabs .tab-end{margin-left:auto;color:#777}
.editor-buffer{padding:13px 18px 11px;font:9px/1.78 var(--font-mono);min-height:302px}
.code-row{display:grid;grid-template-columns:28px 1fr;gap:10px;white-space:pre;opacity:0;animation:code-fade .5s ease forwards;animation-delay:calc(var(--line-index)*55ms + .12s)}
.line-number{color:#545454;text-align:right;user-select:none}
.code-row code{font:inherit;color:#ddd}
.syntax-comment{color:#656565;font-style:italic}
.syntax-keyword{color:#a8a8a8}
.syntax-name{color:#efefef}
.syntax-key{color:#eee}
.syntax-punct{color:#767676}
.syntax-string{color:#c8c8c8;font-style:italic}
.cursor-row{opacity:1;animation:none}
.block-cursor{display:inline-block;width:7px;height:13px;background:#efefef;vertical-align:middle;animation:cursor-blink 1.1s steps(2,start) infinite}
.faint-row{opacity:.34;animation:none}
.editor-statusline{display:flex;align-items:center;gap:13px;min-height:30px;padding:0 10px;background:#151515;color:#888;font:8px var(--font-mono)}
.mode-block{align-self:stretch;display:flex;align-items:center;padding:0 12px;background:#f5f5f5;color:#000;font-weight:500}
.status-spacer{flex:1}
.hero-chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin-top:10px}
.hero-chips>div{min-height:62px;padding:11px 10px;border:1px solid var(--border);border-radius:9px;background:rgba(8,8,8,.8)}
.hero-chips small{display:block;margin-bottom:7px;color:#777;font:8px var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.hero-chips b{display:flex;align-items:center;gap:6px;color:#e4e4e4;font-size:9px;font-weight:500;white-space:nowrap}
.tiny-dot{width:6px;height:6px;border:0;background:#ddd}
.marquee{overflow:hidden;margin:2px 0 0;padding:18px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border);white-space:nowrap}
.marquee-track{display:flex;align-items:center;gap:25px;width:max-content;animation:marquee 48s linear infinite}

.marquee-track span em{font-family:var(--font-serif);font-size:18px;letter-spacing:0;text-transform:none;color:#eee}
.marquee-track span i{display:block;width:4px;height:4px;border-radius:50%;background:#555}

.section{padding-top:140px}
.section-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:52px}
.section-heading h2,.lab-sticky h2,.contact-main h2{margin:0;font-size:clamp(48px,6.3vw,88px);font-weight:500;line-height:.91;letter-spacing:-.075em}
.section-heading h2 em,.lab-sticky h2 em,.contact-main h2 em{font-family:var(--font-serif);font-weight:400;letter-spacing:-.035em;background:linear-gradient(180deg,#FCFCFC 0%,#D6D6D6 45%,#707070 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.heading-side-copy{max-width:410px;margin:0 0 5px;color:#999;font-size:12px;line-height:2}

.interests-column{padding-top:5px}
.micro-label{margin-bottom:18px}
.interest-row{display:grid;grid-template-columns:27px 1fr;gap:10px;padding:14px 0;border-top:1px solid var(--border);color:#ccc;font-size:10px;line-height:1.6;transition:padding .25s,color .25s}
.interest-row:hover{padding-left:5px;color:#fff}
.interest-row small{color:#666;font:9px var(--font-mono)}
.about-prose p{margin:0 0 17px;color:#999;font-size:11px;line-height:2}

.process-step>span{display:block;margin-top:8px;color:#777;font-size:9px;line-height:1.5}

.feature-row.reverse .feature-preview{order:1}
.feature-copy{display:flex;flex-direction:column;align-items:flex-start;padding:28px 0 25px;min-width:0}
.feature-top{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;flex-wrap:wrap}
.feature-kind{color:#858585;font:9px var(--font-mono);letter-spacing:.08em;text-transform:uppercase}
.status-tag{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border:1px solid var(--border-strong);border-radius:999px;color:#c7c7c7;font:8px var(--font-mono);white-space:nowrap}
.status-tag i{width:5px;height:5px;border-radius:50%;background:#aaa}
.status-tag.solid{background:#f5f5f5;border-color:#f5f5f5;color:#050505}
.feature-copy h3{margin:34px 0 7px;font-size:clamp(37px,4.8vw,64px);line-height:.92;font-weight:500;letter-spacing:-.075em}
.feature-tagline{margin:0 0 17px;color:#ddd;font:italic 24px/1.1 var(--font-serif)}
.feature-description{max-width:590px;margin:0;color:#999;font-size:11px;line-height:1.95}
.feature-details{display:grid;gap:10px;margin:22px 0 0;padding:0 0 0 16px;border-left:1px solid #555;list-style:none}
.feature-details li{position:relative;color:#b2b2b2;font-size:10px;line-height:1.65}
.feature-details li:before{content:"";position:absolute;top:.65em;left:-16px;width:5px;height:1px;background:#aaa}
.feature-tech{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:24px;color:#888;font:8px var(--font-mono)}
.tech-sep{color:#4e4e4e}
.feature-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.feature-actions .pill-button{min-height:38px;padding-inline:14px;font-size:9px}
.feature-preview{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:16/11;min-height:330px;max-height:500px;padding:22px;overflow:hidden;border:1px solid #343434;border-radius:var(--radius);background:radial-gradient(ellipse at 50% 0%,#262626 0%,#101010 50%,#030303 100%);box-shadow:0 0 0 1px rgba(255,255,255,.035),0 25px 72px rgba(0,0,0,.7),0 0 24px rgba(255,255,255,.025)}
.feature-preview:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.025),transparent 38%,rgba(0,0,0,.15))}
.preview-index{position:absolute;z-index:5;top:15px;left:17px;color:#686868;font:7px var(--font-mono);letter-spacing:.13em}
.preview-open{position:absolute;z-index:6;top:12px;right:12px;display:grid;place-items:center;width:33px;height:33px;border:1px solid #505050;border-radius:50%;background:rgba(0,0,0,.4);color:#ddd;opacity:0;transform:translate(-3px,3px);transition:opacity .25s,transform .25s,background .25s,color .25s}
.feature-preview:hover .preview-open{opacity:1;transform:translate(0,0)}
.preview-open:hover{background:#fff;color:#000}
.preview-shell{position:relative;z-index:1;width:100%;height:100%;min-height:0;border:1px solid #303030;border-radius:10px;background:#060606;overflow:hidden;box-shadow:0 15px 45px rgba(0,0,0,.6)}
.preview-glyph{padding:18px 19px 13px}
.mock-top{display:flex;align-items:center;justify-content:space-between;color:#989898;font:7px var(--font-mono);letter-spacing:.12em}
.mock-dots{display:flex;gap:5px}.mock-dots i{width:4px;height:4px;border-radius:50%;background:#777}
.mock-top .doto{font:900 12px var(--font-doto);letter-spacing:.13em;color:#eee}
.mock-wifi{font-size:7px;color:#888}
.doto{font-family:var(--font-doto);font-weight:900}
.glyph-clock{display:flex;flex-direction:column;align-items:center;margin:11px 0 14px}
.glyph-clock strong{font:900 clamp(36px,5.3vw,65px)/.95 var(--font-doto);letter-spacing:-.05em;color:#eee}
.glyph-clock span{margin-top:7px;color:#777;font:7px var(--font-mono);letter-spacing:.13em}
.glyph-controls{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.control-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.control-tile{display:grid;grid-template-columns:22px 1fr;align-items:center;gap:1px 5px;min-height:49px;padding:7px;border:1px solid #262626;border-radius:6px;background:#0d0d0d}
.control-tile>span{grid-row:span 2;color:#777;font-size:13px;text-align:center}
.control-tile b{color:#ddd;font-size:7px;font-weight:500}
.control-tile small{color:#686868;font-size:6px}
.control-tile.on{border-color:#555;background:#171717}
.control-tile.on>span{color:#eee}
.mock-sliders{display:grid;align-content:center;gap:15px;padding:4px 0}
.mock-sliders>div{display:grid;gap:7px}
.mock-sliders small{color:#888;font:7px var(--font-mono)}
.mock-sliders i{display:block;height:4px;overflow:hidden;border-radius:99px;background:#242424}
.mock-sliders i b{display:block;height:100%;background:#cfcfcf;border-radius:99px}
.system-meters{grid-column:1/-1;display:flex;gap:20px;padding-top:7px;color:#707070;font:6px var(--font-mono);letter-spacing:.08em}
.glyph-command{display:flex;align-items:center;gap:10px;margin-top:9px;padding:8px 10px;border:1px solid #303030;border-radius:6px;background:#0c0c0c;color:#aaa;font:7px var(--font-mono)}
.glyph-command>span{font-size:14px}.glyph-command b{color:#ddd;font-weight:400}.glyph-command small{margin-left:auto;color:#696969;font-size:6px}.glyph-command i{width:5px;height:10px;background:#eee;animation:cursor-blink 1s steps(2,start) infinite}
.glyph-dock{display:flex;justify-content:center;gap:20px;margin-top:9px;color:#a5a5a5;font-size:12px}
.preview-cipher{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;padding:27px 20px 20px;gap:16px}
.watch-stage{position:relative;display:grid;justify-items:center;align-items:center;height:100%}
.watch-strap{position:absolute;top:2%;bottom:2%;width:40%;border:1px solid #393939;border-radius:20px;background:repeating-linear-gradient(0deg,#141414 0 8px,#1a1a1a 9px 10px);box-shadow:inset 0 0 0 5px #090909}
.watch-body{position:relative;z-index:1;width:min(74%,205px);aspect-ratio:1/1.12;padding:9px;border:2px solid #707070;border-radius:28%;background:linear-gradient(145deg,#242424,#050505 70%);box-shadow:0 12px 35px #000}
.watch-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;border:1px solid #444;border-radius:23%;background:#020202}
.watch-status{display:flex;align-items:center;gap:5px;color:#8e8e8e;font:6px var(--font-mono)}
.watch-status i{width:4px;height:4px;border-radius:50%;background:#ddd}
.watch-screen>strong{margin:10px 0 1px;color:#fff;font:900 clamp(25px,3vw,40px)/1 var(--font-doto)}
.watch-date{color:#888;font:7px var(--font-mono)}
.watch-divider{width:60%;height:1px;margin:10px 0;background:#343434}
.watch-stat{display:flex;align-items:center;gap:6px;color:#ddd;font:8px var(--font-mono)}
.watch-stat span{font-size:13px}
.watch-battery{display:flex;align-items:center;gap:5px;margin-top:7px;color:#999;font:7px var(--font-mono)}
.watch-battery i{width:21px;height:8px;border:1px solid #777;border-radius:2px}
.watch-battery i:after{content:"";display:block;width:81%;height:100%;background:#ddd}
.watch-caption{position:absolute;bottom:0;color:#6c6c6c;font:6px var(--font-mono);letter-spacing:.1em}
.pin-stage{padding:15px 10px;border:1px solid #2a2a2a;border-radius:8px;background:#080808}
.pin-title{display:flex;justify-content:space-between;gap:8px;color:#aaa;font:7px var(--font-mono)}
.pin-title span{color:#ddd;letter-spacing:.25em}
.pin-dots{display:flex;justify-content:center;gap:9px;margin:15px 0}
.pin-dots i{width:7px;height:7px;border:1px solid #8a8a8a;border-radius:50%}
.pin-dots i:not(:last-child){background:#eee;border-color:#eee}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.pin-grid span{display:grid;place-items:center;aspect-ratio:1.2;border:1px solid #242424;border-radius:5px;color:#ccc;font:10px var(--font-mono)}
.pin-grid span.selected{background:#eee;color:#000;border-color:#eee}
.pin-foot{margin-top:12px;text-align:center;color:#707070;font:6px var(--font-mono)}
.pin-foot i{display:inline-block;width:3px;height:3px;margin:0 5px;border-radius:50%;background:#777;vertical-align:middle}
.preview-one{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;padding:15px 17px 12px;gap:5px;background:radial-gradient(ellipse at 35% 50%,#1b1b1b 0%,#070707 65%)}
.phone-preview{position:relative;display:flex;align-items:center;justify-content:center;height:100%;min-height:0;overflow:hidden;mask-image:linear-gradient(to right,#000 0%,#000 80%,transparent 100%)}
.phone-preview img{display:block;height:92%;max-height:92%;width:auto;max-width:100%;object-fit:contain;filter:drop-shadow(0 16px 20px rgba(0,0,0,.8));transform:scale(1.05)}
.glyph-pulse{position:absolute;left:85%;top:89%;width:9px;height:9px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 4px rgba(255,255,255,.9),0 0 17px rgba(255,255,255,.5);animation:glyph-flash 3.5s infinite}
.phone-image-label{position:absolute;bottom:6px;left:12%;color:#696969;font:6px var(--font-mono);letter-spacing:.12em}
.glyph-modes{display:flex;flex-direction:column;justify-content:center;align-self:stretch;padding:20px 9px 18px 15px;border-left:1px solid #343434}
.mode-heading{display:flex;align-items:center;gap:8px;color:#999;font:8px var(--font-mono);letter-spacing:.1em;white-space:nowrap}
.mode-heading i{width:5px;height:5px;border-radius:50%;background:#ccc;box-shadow:0 0 9px #fff}
.mode-list{display:grid;gap:13px;margin:23px 0 17px}
.mode-list span{color:#777;font:10px var(--font-mono);text-transform:lowercase;transition:color .2s}
.mode-list span.active{color:#fff;text-shadow:0 0 12px rgba(255,255,255,.45)}
.morse-code{padding-top:13px;border-top:1px solid #303030;color:#d7d7d7;font:11px var(--font-mono);letter-spacing:.03em;white-space:nowrap}
.glyph-mode-footer{display:flex;align-items:center;gap:6px;margin-top:auto;color:#686868;font:6px var(--font-mono);letter-spacing:.1em}
.glyph-mode-footer i{width:4px;height:4px;border-radius:50%;background:#ddd}
.preview-tv{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px 25px 16px;background:radial-gradient(ellipse at 50% 45%,#1d1d1d 0%,#090909 65%)}
.tv-frame{position:relative;width:90%;height:78%;padding:8px;border:2px solid #676767;border-radius:9px;background:linear-gradient(140deg,#262626,#050505);box-shadow:0 14px 38px rgba(0,0,0,.8)}
.tv-screen{height:100%;padding:8px 10px;overflow:hidden;border:1px solid #292929;border-radius:3px;background:#060606}
.tv-topbar{display:flex;align-items:center;justify-content:space-between;color:#9e9e9e;font:6px var(--font-mono)}
.tv-topbar b{color:#eee;font:500 9px var(--font-sans);letter-spacing:-.04em}
.tv-topbar span{font-size:5px;letter-spacing:.04em}
.tv-hero-tile{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding:10px 11px;border:1px solid #333;border-radius:4px;background:linear-gradient(110deg,#252525,#090909)}
.tv-hero-tile>div{display:grid;gap:5px}
.tv-hero-tile small{color:#8d8d8d;font:5px var(--font-mono)}
.tv-hero-tile b{color:#eee;font-size:13px;line-height:1.05;letter-spacing:-.05em}
.tv-hero-tile span{color:#aaa;font:5px var(--font-mono)}
.tv-play{display:grid;place-items:center;width:25px;height:25px;border:1px solid #777;border-radius:50%;color:#eee;font-size:8px;font-style:normal}
.tv-row-title{display:flex;justify-content:space-between;margin:10px 0 5px;color:#ddd;font-size:7px;font-weight:600}
.tv-row-title small{color:#777;font:5px var(--font-mono)}
.tv-tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tv-tiles i{display:block;aspect-ratio:1.65;border:1px solid #303030;border-radius:3px;background:linear-gradient(140deg,#282828,#101010)}
.tv-tiles i:nth-child(2){background:linear-gradient(140deg,#444,#111)}
.tv-tiles .focus-tile{outline:2px solid #eee;outline-offset:1px;animation:focus-slide 5s ease-in-out infinite}
.tv-tiles.short{grid-template-columns:repeat(3,1fr)}
.tv-tiles.short i{aspect-ratio:2.8;background:linear-gradient(90deg,#292929,#101010)}
.tv-bezel{position:absolute;bottom:-5px;left:25%;width:50%;height:4px;border-radius:0 0 3px 3px;background:#555}
.tv-stand{width:16%;height:9px;margin-top:-2px;border-bottom:1px solid #555;clip-path:polygon(38% 0,62% 0,75% 100%,25% 100%);background:#393939}
.tv-dpad{margin-top:13px;color:#777;font:6px var(--font-mono);letter-spacing:.16em}
.more-apps-heading{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin:100px 0 23px;padding-top:25px;border-top:1px solid var(--border)}
.more-apps-heading h3{margin:0;font-size:clamp(34px,4vw,52px);font-weight:500;letter-spacing:-.07em}
.more-apps-heading h3 em{font-family:var(--font-serif);font-weight:400;color:#ccc}
.more-apps-heading p{color:#777;font:9px var(--font-mono);letter-spacing:.12em;text-transform:uppercase}
.apps-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.app-card{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:12px;min-height:230px;padding:22px;border:1px solid var(--border-strong);border-radius:var(--radius);background:radial-gradient(ellipse at 50% 0%,#202020 0%,#090909 65%,#030303 100%);box-shadow:0 15px 45px rgba(0,0,0,.35);overflow:hidden}
.app-card:before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.07),transparent 72%);opacity:0;transition:opacity .3s}
.app-card:hover:before{opacity:1}
.app-span-7{grid-column:span 7}.app-span-5{grid-column:span 5}
.app-copy{position:relative;z-index:1;display:flex;flex-direction:column;min-width:0}
.app-top{display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}
.app-top>span:first-child{color:#8c8c8c;font:8px var(--font-mono);letter-spacing:.1em;text-transform:uppercase}
.app-top .status-tag{font-size:7px}
.app-card h4{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:24px 0 10px;font-size:23px;font-weight:500;letter-spacing:-.06em}
.app-card h4 a{display:grid;place-items:center;width:28px;height:28px;border:1px solid #444;border-radius:50%;color:#ddd;transition:background .25s,color .25s}
.app-card h4 a:hover{background:#fff;color:#000}
.app-card h4 .arrow-icon{font-size:13px}
.app-card p{margin:0;color:#999;font-size:10px;line-height:1.9}
.app-tech{margin-top:auto;padding-top:19px;color:#858585;font:8px var(--font-mono)}
.app-art{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;min-width:0;min-height:150px;border-left:1px solid rgba(255,255,255,.08);padding-left:13px}
.art-wave{display:flex;position:relative;align-items:center;justify-content:center;gap:3px;width:100%;height:85px}
.art-wave>i{display:block;width:3px;height:var(--bar);max-height:74px;border-radius:4px;background:#4b4b4b}
.art-wave>i:nth-child(-n+10){background:#ddd}
.mini-player{position:absolute;bottom:-33px;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border:1px solid #303030;border-radius:999px;background:#111;color:#aaa;font:7px var(--font-mono)}
.mini-player b{color:#fff;font-size:12px}
.art-shield{display:flex;align-items:center;gap:13px;width:100%;justify-content:center}
.art-shield svg{width:76px;max-width:48%;fill:none;stroke:#aaa;stroke-width:1.3}
.art-shield div{display:grid;gap:11px;color:#888;font:7px var(--font-mono)}
.art-clock{display:flex;flex-direction:column;align-items:center;gap:9px}
.clock-face{position:relative;width:100px;height:100px;border:1px solid #5e5e5e;border-radius:50%;background:radial-gradient(circle,#191919,#050505);box-shadow:0 0 0 6px rgba(255,255,255,.025),inset 0 0 20px #000}
.clock-face:before,.clock-face:after{content:"";position:absolute;background:#5d5d5d}
.clock-face:before{top:8px;bottom:8px;left:50%;width:1px}
.clock-face:after{left:8px;right:8px;top:50%;height:1px}
.clock-face b{position:absolute;z-index:3;left:50%;top:50%;width:5px;height:5px;margin:-2px 0 0 -2px;border-radius:50%;background:#eee}
.hand{position:absolute;z-index:2;left:50%;bottom:50%;width:2px;border-radius:4px;background:#eee;transform-origin:bottom center}
.hand.hour{height:23px;transform:rotate(305deg)}
.hand.minute{height:34px;transform:rotate(60deg)}
.hand.second{height:37px;width:1px;background:#888;transform:rotate(120deg)}
.art-clock>span{color:#777;font:6px var(--font-mono);letter-spacing:.15em}
.art-clock>strong{font:9px var(--font-mono);color:#ccc}
.art-terminal{width:100%;padding:11px 9px;border:1px solid #353535;border-radius:7px;background:#050505;box-shadow:0 10px 25px #000}
.art-terminal-head{display:flex;align-items:center;gap:4px;margin:-11px -9px 10px;padding:7px 9px;border-bottom:1px solid #292929;color:#888;font:6px var(--font-mono)}
.art-terminal-head i{width:4px;height:4px;border-radius:50%;background:#777}
.art-terminal-head span{margin-left:6px}
.art-terminal code{display:block;margin:7px 0;color:#a8a8a8;font:7px/1.4 var(--font-mono);white-space:normal}
.art-terminal code:first-of-type{color:#eee}
.art-terminal code b{color:#ddd;font-weight:500}
.repo-index{margin-top:90px;padding-top:24px;border-top:1px solid var(--border)}
.repo-index-heading{display:flex;align-items:baseline;justify-content:space-between;gap:20px;margin-bottom:20px}
.repo-index-heading h3{margin:0;font-size:24px;font-weight:500;letter-spacing:-.06em}
.repo-index-heading small{display:flex;gap:17px;color:#777;font:8px var(--font-mono);text-transform:uppercase;letter-spacing:.1em}
.repo-index-heading small span{width:24px;height:1px;margin:auto;background:#555}
.repo-table{border-top:1px solid #303030}
.repo-table-head,.repo-row{display:grid;grid-template-columns:2.2fr 5.7fr 2fr 25px;gap:18px;align-items:center}
.repo-table-head{padding:11px 13px;color:#777;font:8px var(--font-mono);letter-spacing:.1em;text-transform:uppercase}
.repo-row{position:relative;padding:17px 13px;border-top:1px solid #1e1e1e;overflow:hidden;transition:padding .25s,color .25s}
.repo-row:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#151515,#080808);transform:translateY(100%);transition:transform .35s;z-index:-1}
.repo-row:hover:before{transform:translateY(0)}
.repo-row:hover{padding-left:20px}
.repo-name{display:flex;align-items:center;gap:14px}
.repo-name small{color:#656565;font:8px var(--font-mono)}
.repo-name b{font-size:11px;font-weight:500}
.repo-description{display:block;color:#929292;font-size:9px;line-height:1.65}
.repo-description i{display:block;margin-bottom:3px;color:#c7c7c7;font:8px var(--font-mono);font-style:normal}
.repo-state{color:#999;font:8px var(--font-mono)}
.repo-arrow{color:#777;text-align:right;transition:transform .2s,color .2s}
.repo-row:hover .repo-arrow{transform:translate(3px,-3px);color:#fff}

.lab-section{position:relative;margin-top:125px;padding:85px 0 88px;background:radial-gradient(ellipse at 13% 12%,#1a1a1a 0%,#080808 47%,#000 82%)}
.lab-section:before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(#3B3B3B .8px,transparent 1px);background-size:22px 22px;opacity:.22;mask-image:linear-gradient(to bottom,#000,transparent 90%)}
.lab-layout{position:relative;z-index:1;display:grid;grid-template-columns:4.2fr 7.8fr;gap:70px}
.lab-sticky{position:sticky;top:150px;align-self:start}
.lab-sticky .section-label{margin-bottom:20px}
.lab-sticky h2{font-size:clamp(48px,6vw,78px)}
.lab-sticky>p{max-width:360px;margin:21px 0 0;color:#999;font-size:11px;line-height:2}
.lab-items{border-top:1px solid #333}
.lab-item{padding:23px 0 25px;border-bottom:1px solid #292929}
.lab-item-top{display:flex;align-items:center;gap:12px}
.lab-item-top>b{color:#555;font:12px var(--font-mono);transition:color .2s}
.lab-item:hover .lab-item-top>b{color:#eee}
.lab-item-top>span{color:#999;font:8px var(--font-mono);letter-spacing:.07em;text-transform:uppercase}
.lab-item-top>i{height:1px;flex:1;background:#333}
.lab-item-top>small{color:#c8c8c8;font:8px var(--font-mono);text-transform:uppercase}
.lab-item h3{margin:22px 0 8px;font-size:27px;font-weight:500;letter-spacing:-.06em}
.lab-item p{max-width:560px;margin:0;color:#999;font-size:10px;line-height:1.9}

.contact-section{padding-top:130px}
.contact-main{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:end;padding-bottom:36px}
.contact-main h2{font-size:clamp(53px,7vw,92px)}
.contact-main>div>p{max-width:470px;margin:23px 0 0;color:#999;font-size:11px;line-height:1.95}

/* Primary IDE is Visual Studio Code; Neovim remains a compact side editor. */
.editor-stage{position:relative;isolation:isolate;margin-bottom:31px;overflow:visible;transform-style:preserve-3d}
.editor-window.vscode-window{overflow:hidden;position:relative;z-index:1}
.vscode-mark{display:grid;grid-template-columns:repeat(2,5px);grid-template-rows:repeat(2,5px);gap:2px;flex:0 0 auto;transform:skewY(-12deg)}
.vscode-mark i{display:block;background:#c9c9c9;border-radius:1px}
.vscode-mark i:nth-child(2),.vscode-mark i:nth-child(3){background:#868686}
.editor-tabs .file-glyph{display:inline-grid;place-items:center;width:11px;height:12px;margin-right:3px;color:#e3e3e3;font:7px var(--font-mono);font-style:normal;border:1px solid #8a8a8a;border-radius:2px}
.editor-tabs .file-glyph.json{font-size:5px;border:0;width:15px}
.vscode-workspace{display:grid;grid-template-columns:34px 122px minmax(0,1fr);min-height:350px;background:#101010}
.vscode-activity{display:flex;flex-direction:column;align-items:center;gap:20px;padding:15px 0;border-right:1px solid #252525;background:#111;color:#767676;font:15px var(--font-sans)}
.vscode-activity span{display:grid;place-items:center;width:100%;height:22px}
.vscode-activity .activity-active{border-left:2px solid #eee;color:#eee}
.vscode-activity .activity-bottom{margin-top:auto;font-size:13px}
.vscode-explorer{padding:13px 8px;border-right:1px solid #252525;background:#0d0d0d;color:#8b8b8b;font:7px var(--font-mono);overflow:hidden}
.explorer-heading{margin-bottom:17px;color:#aaa;font-size:7px;letter-spacing:.12em}
.explorer-folder{margin-bottom:11px;color:#c3c3c3;white-space:nowrap}
.explorer-file{display:flex;align-items:center;gap:6px;padding:7px 4px;white-space:nowrap;color:#999}
.explorer-file.selected{background:#202020;color:#eee}
.explorer-file i{display:grid;place-items:center;width:12px;height:12px;border:1px solid #999;border-radius:2px;color:#eee;font-size:7px;font-style:normal}
.explorer-file i.json{border:0;font-size:6px}
.explorer-file i.lua{color:#aaa}
.editor-buffer.vscode-buffer{min-width:0;min-height:350px;overflow:hidden;padding:11px 12px 12px;background:#101010;font-size:8px;line-height:1.95}
.vscode-buffer .breadcrumb{margin:0 0 9px 0;padding-bottom:8px;border-bottom:1px solid #282828;color:#757575;font:7px var(--font-mono)}
.vscode-buffer .code-row{grid-template-columns:24px minmax(0,1fr);gap:8px}
.vscode-buffer .code-row code{overflow:visible}
.vscode-statusline{gap:12px;background:#252525;color:#aaa}
.vscode-statusline .status-branch{margin-left:-10px;padding:0 10px;background:#ddd;color:#111}
.editor-stage>.neovim-side{position:absolute;z-index:4;right:-17px;bottom:-23px;width:39%;min-height:126px;padding:10px 12px 0;border:1px solid #505050;border-radius:8px;background:radial-gradient(ellipse at 50% 0%,#272727,#080808 78%);box-shadow:0 18px 40px rgba(0,0,0,.85),0 0 20px rgba(255,255,255,.055);transform:translateZ(22px)}
.neovim-side-head{display:flex;align-items:center;gap:6px;padding-bottom:8px;border-bottom:1px solid #303030;color:#aaa;font:7px var(--font-mono);letter-spacing:.1em}
.nvim-mark{display:grid;place-items:center;width:15px;height:15px;border:1px solid #888;border-radius:3px;color:#eee;font:9px var(--font-mono)}
.neovim-side-head b{color:#eee;font-weight:500}
.neovim-side-head small{margin-left:auto;color:#777;font-size:6px}
.neovim-side-head>i{width:5px;height:5px;border-radius:50%;background:#bcbcbc}
.neovim-side-path{padding:8px 0 6px;color:#c8c8c8;font:7px var(--font-mono)}
.neovim-side-code{color:#ccc;font:7px/1.8 var(--font-mono)}
.neovim-side-code>span{color:#666}
.neovim-side-code b{color:#777;font-weight:400}
.neovim-side-code em{color:#aaa;font-style:normal}
.neovim-side-code u{color:#eee;text-decoration:none}
.mini-cursor{display:inline-block;width:5px;height:9px;background:#eee;vertical-align:middle;animation:cursor-blink 1.1s steps(2,start) infinite}
.neovim-side-status{display:flex;gap:8px;margin:6px -12px 0;padding:5px 8px;background:#1b1b1b;color:#888;font:6px var(--font-mono)}
.neovim-side-status b{color:#eee;font-weight:500}
.title-mask.command-third{margin-top:-.015em}
@media(max-width:820px){
  .vscode-workspace{grid-template-columns:29px 102px minmax(0,1fr);min-height:330px}
  .editor-buffer.vscode-buffer{min-height:330px}
  .editor-stage>.neovim-side{right:-7px;width:42%}
}
@media(max-width:640px){
  .editor-stage{margin-bottom:35px}
  .vscode-workspace{grid-template-columns:24px 76px minmax(0,1fr);min-height:0}
  .vscode-activity{gap:14px;padding:10px 0;font-size:12px}
  .vscode-activity span{height:18px}
  .vscode-explorer{padding:10px 4px;font-size:5.5px}
  .explorer-heading{font-size:5.5px;margin-bottom:12px}
  .explorer-file{gap:3px;padding:6px 2px}
  .explorer-file i{width:9px;height:9px;font-size:5px}
  .editor-buffer.vscode-buffer{min-height:0;padding:8px 6px;font-size:6.1px;line-height:1.85}
  .vscode-buffer .breadcrumb{font-size:5.2px;padding-bottom:6px}
  .vscode-buffer .code-row{grid-template-columns:17px minmax(0,1fr);gap:4px}
  .editor-tabs .file-glyph{width:9px;height:10px;font-size:5px}
  .vscode-statusline{gap:7px;font-size:6px}
  .editor-path{font-size:6.3px}
  .vscode-mark{transform:scale(.8) skewY(-12deg)}
  .editor-stage>.neovim-side{right:-4px;bottom:-28px;width:47%;min-height:103px;padding:7px 8px 0}
  .neovim-side-head{font-size:6px;padding-bottom:5px}
  .nvim-mark{width:12px;height:12px;font-size:7px}
  .neovim-side-head small{font-size:5px}
  .neovim-side-path{font-size:6px;padding:6px 0 4px}
  .neovim-side-code{font-size:6px}
  .neovim-side-status{margin:4px -8px 0;padding:4px 6px;font-size:5px}
}

</style>
